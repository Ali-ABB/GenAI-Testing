name: GenAI Evaluation & Report Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Run nightly at midnight UTC
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  evaluate:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute GenAI Evaluation Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run test:eval

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

        - name: Ensure Report Directory Exists
        if: always()
        run: |
          mkdir -p playwright-report
          if [ ! -f playwright-report/index.html ]; then
            echo "<h1>GenAI Evaluation Report Not Available</h1>" > playwright-report/index.html
          fi
      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/ # Playwright default HTML report folder

  deploy:
    name: Deploy Evaluation Report to GitHub Pages
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
